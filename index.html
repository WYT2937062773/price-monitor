<!doctype html><meta charset=utf-8>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>价格监控 · 离线版</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
   background:linear-gradient(160deg,#0F1B33,#1B2E55 60%,#24406E);
   font:15px/1.7 "Microsoft YaHei",system-ui;color:#EAF0FA;padding:22px}
 .card{width:min(400px,100%);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
   border-radius:16px;padding:26px 22px;box-shadow:0 18px 48px rgba(0,0,0,.35)}
 h1{font-size:19px;margin:0 0 4px}
 .sub{color:#9FB2D8;font-size:12.5px;margin-bottom:18px}
 label{display:block;font-size:12.5px;color:#AFC0DE;margin:10px 0 5px}
 input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.22);
   background:rgba(255,255,255,.10);color:#fff;font-size:14px}
 input:focus{outline:none;border-color:#6C8FE8}
 button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:10px;background:#2F5FD0;
   color:#fff;font-size:15px;font-weight:700;cursor:pointer}
 .msg{margin-top:12px;font-size:13px;color:#FFB4B4;min-height:20px}
 .hint{margin-top:14px;font-size:11.5px;color:#8FA3C8;line-height:1.8}
 a{color:#9FC0FF}
</style>
<div class="card">
  <h1>价格监控 · 离线版</h1>
  <div class="sub">共有 13 个门店账号可用 · 需要账号密码</div>
  <label>门店账号</label>
  <input id="u" placeholder="如 耙二哥双碑店" autocomplete="username">
  <button id="go">下一步</button>
  <div class="msg" id="msg"></div>
  <div class="hint">忘记账号请联系管理员；<br>在线版请回到 <a href="../go.html">统一入口</a>。</div>
</div>
<script>
document.getElementById("go").onclick = async () => {
  const u = document.getElementById("u").value.trim();
  const msg = document.getElementById("msg");
  if(!u){ msg.textContent = "请输入门店账号"; return; }
  try{
    // 根目录入口 → off/，off/ 目录内入口 → 同目录
    const base = location.pathname.includes("/off/") ? "" : "off/";
    const m = await (await fetch(base + "manifest.json?t=" + Date.now())).json();
    const hit = m[u];
    if(!hit){ msg.textContent = "没有这个账号"; return; }
    location.href = base + hit.f;
  }catch(e){ msg.textContent = "加载失败：" + e; }
};
document.getElementById("u").onkeydown = e => { if(e.key === "Enter") document.getElementById("go").click(); };
</script>
