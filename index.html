    `<div class="bar ${st.store === n ? "on" : ""}" data-s="${n}">
       <div class="nm" title="${n}">${n}</div>
       <div class="tr"><i style="width:${Math.max(3, Math.round(v / mx * 100))}%"></i></div>
       <div class="vv">${v}</div></div>`).join("");
  const pos = {};
  list.forEach(r => pos[r.p] = (pos[r.p] || 0) + 1);
  const tot = list.length || 1;
  const colors = {新高:"#E23D3D", 新低:"#12A06D", 区间内:"#DE8A0B", 样本不足:"#9B6BD6"};
  $("#chart2").innerHTML = Object.entries(pos).sort((a, b) => b[1] - a[1]).map(([n, v]) =>
    `<div class="tag ${st.type === n ? "on" : ""}" data-t="${n}" style="border-left-color:${colors[n] || "#2F5FD0"}">
       <div class="n">${n}</div><div class="v">${v} <span class="hint">${Math.round(v / tot * 100)}%</span></div></div>`).join("");
}

function table(){
  const list = filtered().slice().sort((a, b) => {
    const k = st.sort;
    let x = a[k], y = b[k];
    if (typeof x === "number") return st.desc ? y - x : x - y;
    return st.desc ? String(y).localeCompare(String(x)) : String(x).localeCompare(String(y));
  });
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / st.pageSize));
  st.page = Math.min(st.page, pages - 1);
  const page = list.slice(st.page * st.pageSize, (st.page + 1) * st.pageSize);
  $("#cnt").textContent = `${total} 条`;
  $("#pinfo").textContent = `第 ${st.page + 1}/${pages} 页`;
  $("#tb").innerHTML = page.map(r => {
    const cls = r.st > 0 ? "up" : "down";
    return `<tr data-m="${r.m}" data-sup="${r.sup}">
      <td>${r.s}</td><td>${r.m}</td><td>${r.sup}</td>
      <td class="r">${f2(r.pr)}</td><td class="r ${cls}">${r.st > 0 ? "+" : ""}${r.st.toFixed(1)}%</td>
      <td>${r.p}</td><td>${r.d}</td><td>${r.bill || ""}</td></tr>`;
  }).join("");
}

function render(){ kpi(); charts(); table(); }

// ---- 趋势图（缩放/平移）----
let T = null;
function openTrend(m, sup){
  const h = HIST[m] || [];
  $("#ttl").textContent = m;
  $("#meta").textContent = h.length ? `历史 ${h.length} 次采购 · 供货商 ${[...new Set(h.map(x => x[2]))].join("、")}` : "暂无历史采购记录";
  $("#mask").classList.add("on");
  if (!h.length){ $("#trend").innerHTML = ""; return; }
  const ds = h.map(x => x[0]), ps = h.map(x => x[1]);
  const t0 = new Date(ds[0]).getTime(), t1 = new Date(ds[ds.length - 1]).getTime();
  const pMin = Math.min(...ps), pMax = Math.max(...ps);
  T = {ds, ps, t0: t0, t1: t1 || t0 + 86400000, pMin, pMax, zx0: t0, zx1: t1 || t0 + 86400000};
  drawTrend();
}
function drawTrend(){
  const {ds, ps, pMin, pMax, zx0, zx1} = T;
  const W = 820, H = 300, padL = 52, padR = 14, padT = 16, padB = 34;
  const iw = W - padL - padR, ih = H - padT - padB;
  const span = Math.max(1, zx1 - zx0);
  const x = d => padL + (new Date(d).getTime() - zx0) / span * iw;
  const y = p => padT + (1 - (p - pMin) / Math.max(0.01, pMax - pMin)) * ih;
  const pts = ds.map((d, i) => [x(d), y(ps[i])]).filter(p => p[0] >= padL - 1 && p[0] <= W - padR + 1);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const grid = [0, .25, .5, .75, 1].map(f => {
    const yy = padT + f * ih, val = pMax - f * (pMax - pMin);
    return `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="#EEF2FA"/>
            <text x="${padL - 6}" y="${yy + 4}" font-size="10" fill="#98A3B8" text-anchor="end">${val.toFixed(1)}</text>`;
  }).join("");
  const dots = pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#2F5FD0"><title>${ds[i]} ${ps[i]}</title></circle>`).join("");
  $("#trend").innerHTML = grid +
    `<path d="${line}" fill="none" stroke="#2F5FD0" stroke-width="1.8"/>` + dots +
    `<text x="${padL}" y="${H - 8}" font-size="10" fill="#98A3B8">${ds[0]}</text>` +
    `<text x="${W - padR}" y="${H - 8}" font-size="10" fill="#98A3B8" text-anchor="end">${ds[ds.length - 1]}</text>`;
}
const svg = $("#trend");
svg.addEventListener("wheel", e => {
  if (!T) return;
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const fx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const span = T.zx1 - T.zx0;
  const k = e.deltaY < 0 ? 0.82 : 1.22;
  const anchor = T.zx0 + span * fx;
  T.zx0 = anchor - (anchor - T.zx0) * k;
  T.zx1 = anchor + (T.zx1 - anchor) * k;
  const minSpan = (T.t1 - T.t0) / 50;
  if (T.zx1 - T.zx0 < minSpan){ const c = (T.zx0 + T.zx1) / 2; T.zx0 = c - minSpan / 2; T.zx1 = c + minSpan / 2; }
  T.zx0 = Math.max(T.t0, T.zx0); T.zx1 = Math.min(T.t1, T.zx1);
  drawTrend();
}, {passive: false});
let drag = null;
svg.addEventListener("pointerdown", e => { drag = {x: e.clientX, a: T && T.zx0, b: T && T.zx1}; });
svg.addEventListener("pointermove", e => {
  if (!drag || !T) return;
  const r = svg.getBoundingClientRect();
  const dx = (e.clientX - drag.x) / r.width * (drag.b - drag.a);
  T.zx0 = drag.a - dx; T.zx1 = drag.b - dx;
  const w = T.zx1 - T.zx0;
  if (T.zx0 < T.t0){ T.zx0 = T.t0; T.zx1 = T.t0 + w; }
  if (T.zx1 > T.t1){ T.zx1 = T.t1; T.zx0 = T.t1 - w; }
  drawTrend();
});
svg.addEventListener("pointerup", () => { drag = null; });
svg.addEventListener("dblclick", () => { if (T){ T.zx0 = T.t0; T.zx1 = T.t1; drawTrend(); } });

// ---- 事件 ----
$("#fstore").onchange = e => { st.store = e.target.value; st.page = 0; render(); };
$("#fbrand").onchange = e => { st.brand = e.target.value; st.page = 0; render(); };
$("#fcity").onchange = e => { st.city = e.target.value; st.page = 0; render(); };
$("#ftype").onchange = e => { st.type = e.target.value; st.page = 0; render(); };
$("#fd0").onchange = e => { st.d0 = e.target.value; st.page = 0; render(); };
$("#fd1").onchange = e => { st.d1 = e.target.value; st.page = 0; render(); };
$("#kw").oninput = e => { st.kw = e.target.value; st.page = 0; render(); };
$("#reset").onclick = () => {
  Object.assign(st, {store:"", brand:"", city:"", type:"", d0:"", d1:"", kw:"", page:0});
  ["fstore","fbrand","fcity","ftype"].forEach(id => $(id).value = "");
  $("#kw").value = ""; $("#fd0").value = ""; $("#fd1").value = "";
  render();
};
$("#prev").onclick = () => { st.page = Math.max(0, st.page - 1); table(); };
$("#next").onclick = () => { st.page += 1; table(); };
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  if (st.sort === k) st.desc = !st.desc; else { st.sort = k; st.desc = true; }
  table();
});
$("#chart1").onclick = e => {
  const b = e.target.closest(".bar"); if (!b) return;
  st.store = st.store === b.dataset.s ? "" : b.dataset.s;
  $("#fstore").value = st.store; st.page = 0; render();
};
$("#chart2").onclick = e => {
  const t = e.target.closest(".tag"); if (!t) return;
  st.type = st.type === t.dataset.t ? "" : t.dataset.t;
  $("#ftype").value = st.type; st.page = 0; render();
};
$("#tb").onclick = e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  openTrend(tr.dataset.m, tr.dataset.sup);
};
$("#close").onclick = () => $("#mask").classList.remove("on");
$("#mask").onclick = e => { if (e.target.id === "mask") $("#mask").classList.remove("on"); };
$("#csv").onclick = () => {
  const list = filtered();
  const head = ["门店","品牌","城市","物料","供货商","单价","单步%","位置","日期","单据"];
  const esc = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const lines = [head.map(esc).join(",")].concat(list.map(r =>
    [r.s, r.brand, r.city, r.m, r.sup, r.pr, r.st, r.p, r.d, r.bill].map(esc).join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `需核实明细_${D.to}.csv`;
  a.click();
};

fillSel("#fstore", "s"); fillSel("#fbrand", "brand"); fillSel("#fcity", "city");
render();
</script></body></html>
