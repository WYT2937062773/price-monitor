<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>价格监控看板 2026-11-16</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F7FC;color:#14203A;font:14px/1.55 "Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
header{background:linear-gradient(118deg,#101B33,#1B3E8F 46%,#3D74E0);color:#fff;border-radius:14px;padding:18px 20px}
header h1{margin:0;font-size:20px}
header .s{opacity:.85;font-size:12px;margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kpi{background:#fff;border:1px solid #E5EBF5;border-radius:12px;padding:12px 14px}
.kpi .lb{font-size:12px;color:#6B7A99}
.kpi .vl{font-size:22px;font-weight:700;margin-top:2px}
.kpi.red .vl{color:#E23D3D}
.card{background:#fff;border:1px solid #E5EBF5;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar .nm{width:130px;font-size:13px;color:#3A4A66;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;background:#EEF2FA;border-radius:6px;height:16px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:#2F5FD0;border-radius:6px}
.bar .vv{width:44px;text-align:right;font-size:13px;color:#6B7A99}
.tags{display:flex;gap:10px;flex-wrap:wrap}
.tag{flex:1;min-width:120px;border:1px solid #E5EBF5;border-radius:10px;padding:10px 12px;border-left:4px solid #2F5FD0}
.tag .n{font-size:12px;color:#6B7A99}
.tag .v{font-size:22px;font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
select,input,button{font:inherit;padding:6px 9px;border:1px solid #DDE5F2;border-radius:8px;background:#fff}
button{cursor:pointer}
.tbl{overflow:auto;border:1px solid #E5EBF5;border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:7px 9px;border-bottom:1px solid #F1F5FB;font-size:13px;white-space:nowrap;text-align:left}
th{background:#FAFCFF;color:#6B7A99;position:sticky;top:0}
td.r,th.r{text-align:right}
.up{color:#E23D3D;font-weight:600}.down{color:#12A06D;font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;background:#FDEEEE;color:#C22}
.pill.new{background:#FFF3E0;color:#B36B00}.pill.mid{background:#EEF1F6;color:#5A6780}
.sm{font-size:11px;color:#98A3B8}
.foot{color:#98A3B8;font-size:12px;text-align:center;padding:10px 0 24px}
.foot a{color:#2F5FD0}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.bar .nm{width:90px}}
</style></head><body><div class="wrap">
<header><h1>价格监控看板</h1><div class="s" id="sub"></div></header>
<div class="kpis" id="kpis"></div>
<div class="card"><h2>需核实 TOP 门店</h2><div id="chart1"></div></div>
<div class="card"><h2>偏离类型分布</h2><div class="tags" id="chart2"></div></div>
<div class="card">
  <h2>需核实明细 <span class="sm" id="cnt"></span></h2>
  <div class="toolbar">
    <select id="fstore"><option value="">全部门店</option></select>
    <select id="fpos"><option value="">全部类型</option></select>
    <input id="kw" placeholder="搜索物料 / 供货商">
    <button id="csv">导出 CSV</button>
  </div>
  <div class="tbl"><table><thead><tr>
    <th>门店</th><th>物料</th><th>供货商</th><th class="r">单价</th><th class="r">单步%</th>
    <th>位置</th><th>日期</th><th>单据</th>
  </tr></thead><tbody id="tb"></tbody></table></div>
</div>
<div class="foot">完整数据（可筛选、可分享）：<a href="#" target="_blank">飞书多维表格</a></div>
</div>
<script src=mini5.js></script></body></html>
